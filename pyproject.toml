[project]
name = "consola"
version = "0.1.0"
description = "A Rich SQL Console for interacting database models using SQLAlchemy in Python"
license = "MIT"
license-files = ["LICEN[CS]E.*"]
readme = "README.md"
authors = [{ name = "Daniel Brai", email = "danielbrai.dev@gmail.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Tools",
]
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pre-commit>=4.3.0"]

[project.urls]
Homepage = "https://github.com/Daniel-Brai/Consola"
Repository = "https://github.com/Daniel-Brai/Consola"
